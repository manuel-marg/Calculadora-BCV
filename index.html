<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="utf-8"/>
    <meta content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" name="viewport"/>
    <link href="css/fonts.css" rel="stylesheet"/>
    <link href="css/material-symbols.css" rel="stylesheet"/>
    <script src="js/tailwind.js"></script>
    <script id="tailwind-config">
        tailwind.config = {
            darkMode: "class",
            theme: {
                extend: {
                    "colors": {
                        "on-secondary-fixed-variant": "#3c475a",
                        "on-tertiary-fixed": "#001e2f",
                        "inverse-on-surface": "#eff1f3",
                        "inverse-primary": "#aec6ff",
                        "on-secondary-container": "#586377",
                        "on-secondary-fixed": "#111c2d",
                        "on-tertiary-container": "#ffffff",
                        "on-primary": "#ffffff",
                        "on-tertiary-fixed-variant": "#004c6e",
                        "primary": "#0058c3",
                        "outline": "#727786",
                        "surface-container-highest": "#e0e3e5",
                        "outline-variant": "#c1c6d7",
                        "secondary-fixed": "#d8e3fb",
                        "on-primary-fixed": "#001a43",
                        "tertiary-fixed-dim": "#89ceff",
                        "secondary-container": "#d5e0f8",
                        "on-error-container": "#93000a",
                        "surface-container": "#eceef0",
                        "inverse-surface": "#2d3133",
                        "surface-dim": "#d8dadc",
                        "primary-fixed-dim": "#aec6ff",
                        "secondary": "#545f73",
                        "on-primary-container": "#ffffff",
                        "surface": "#f7f9fb",
                        "surface-bright": "#f7f9fb",
                        "error": "#ba1a1a",
                        "on-surface": "#191c1e",
                        "on-tertiary": "#ffffff",
                        "on-error": "#ffffff",
                        "tertiary-fixed": "#c9e6ff",
                        "on-secondary": "#ffffff",
                        "tertiary-container": "#007eb4",
                        "surface-tint": "#0059c5",
                        "on-surface-variant": "#414754",
                        "primary-fixed": "#d8e2ff",
                        "tertiary": "#00648f",
                        "on-primary-fixed-variant": "#004397",
                        "on-background": "#191c1e",
                        "background": "#f7f9fb",
                        "error-container": "#ffdad6",
                        "surface-variant": "#e0e3e5",
                        "surface-container-lowest": "#ffffff",
                        "secondary-fixed-dim": "#bcc7de",
                        "surface-container-low": "#f2f4f6",
                        "primary-container": "#0070f3",
                        "surface-container-high": "#e6e8ea"
                    },
                    "borderRadius": {
                        "DEFAULT": "0.25rem",
                        "lg": "0.5rem",
                        "xl": "0.75rem",
                        "full": "9999px"
                    },
                    "spacing": {
                        "gutter": "16px",
                        "md": "24px",
                        "xl": "80px",
                        "xs": "4px",
                        "lg": "48px",
                        "base": "8px",
                        "container-max": "480px",
                        "sm": "12px"
                    },
                    "fontFamily": {
                        "headline-lg-mobile": ["Hanken_Grotesk", "sans-serif"],
                        "headline-md": ["Hanken_Grotesk", "sans-serif"],
                        "body-md": ["Inter", "sans-serif"],
                        "label-caps": ["Inter", "sans-serif"],
                        "data-mono": ["JetBrains_Mono", "monospace"]
                    },
                    "fontSize": {
                        "headline-lg-mobile": ["1.5rem", { "lineHeight": "2rem" }],
                        "headline-md": ["1.125rem", { "lineHeight": "1.75rem" }],
                        "body-md": ["1rem", { "lineHeight": "1.5rem" }],
                        "label-caps": ["0.75rem", { "lineHeight": "1rem" }],
                        "data-mono": ["0.875rem", { "lineHeight": "1.25rem" }],
                        "text-lg": ["1.125rem", { "lineHeight": "1.75rem" }]
                    },
                    "fontWeight": {
                        "headline-lg-mobile": "700",
                        "headline-md": "600",
                        "body-md": "400",
                        "label-caps": "500",
                        "data-mono": "500"
                    }
                }
            }
        }
    </script>
</head>
<body>
    <div class="flex min-h-screen flex-col items-center justify-center bg-surface p-4">

        <!-- Main Converter Card -->
        <div class="bg-surface-container-lowest rounded-xl shadow-md p-md relative overflow-hidden w-full max-w-[480px]">
            <!-- Decorative background glow -->
            <div class="absolute -top-24 -right-24 w-48 h-48 bg-primary/5 rounded-full blur-3xl"></div>
            <!-- Controls Row: Date & Currency Selection -->
            <div class="grid grid-cols-2 gap-sm mb-md relative z-10">
                <div class="flex flex-col gap-xs">
                    <label class="font-label-caps text-label-caps text-on-surface-variant uppercase">Fecha de Tasa</label>
                    <div class="flex items-center gap-xs bg-surface-container-low px-sm py-base rounded-lg text-on-surface">
                        <span class="material-symbols-outlined text-[18px]">calendar_today</span>
                        <input type="date" id="date" class="font-data-mono text-data-mono w-full bg-transparent border-none outline-none" value="">
                    </div>
                </div>
                <div class="flex flex-col gap-xs">
                    <label class="font-label-caps text-label-caps text-on-surface-variant uppercase">Moneda</label>
                    <div class="flex items-center justify-between bg-surface-container-low px-sm py-base rounded-lg text-on-surface w-full">
                        <div class="flex-1">
                            <select id="currency" class="w-full bg-transparent border-none outline-none font-body-md text-body-md font-medium pl-0 appearance-none">
                                <option value="USD">Dólar (USD)</option>
                                <option value="EUR">Euro (EUR)</option>
                            </select>
                        </div>
                        <span class="material-symbols-outlined text-[18px]">expand_more</span>
                    </div>
                </div>
            </div>
            <!-- Conversion Inputs Container -->
            <div class="flex flex-col gap-sm relative">
                <!-- Base Currency Input -->
                <div class="group transition-all duration-200">
                    <div class="flex items-center justify-between mb-xs">
                        <span id="currencyFromDynamic" class="font-label-caps text-label-caps text-primary">USD</span>
                    </div>
                    <div class="flex items-center bg-surface-container px-md py-md rounded-xl transition-shadow group-within:shadow-[0_0_0_2px_rgba(0,88,195,0.1)] group-within:bg-white group-within:ring-1 group-within:ring-primary/20">
                        <input class="w-full bg-transparent border-none outline-none font-headline-lg-mobile text-headline-lg-mobile text-on-surface" type="number" id="amountFrom" placeholder="0.00" min="0" step="0.01"/>
                        <div class="w-8 h-8 rounded-full bg-surface-container-highest flex items-center justify-center ml-base">
                            <span class="material-symbols-outlined text-on-surface-variant text-[20px]">attach_money</span>
                        </div>
                    </div>
                </div>
                <!-- Target Currency Input -->
                <div class="group transition-all duration-200">
                    <div class="flex items-center justify-between mb-xs">
                        <span id="currencyToDynamic" class="font-label-caps text-label-caps text-primary">VES</span>
                    </div>
                    <div class="flex items-center bg-surface-container px-md py-md rounded-xl transition-shadow group-within:shadow-[0_0_0_2px_rgba(0,88,195,0.1)] group-within:bg-white group-within:ring-1 group-within:ring-primary/20">
                        <input class="w-full bg-transparent border-none outline-none font-headline-lg-mobile text-headline-lg-mobile text-on-surface" type="number" id="amountTo" placeholder="0.00" min="0" step="0.01" readonly/>
                        <div class="w-8 h-8 rounded-full bg-surface-container-highest flex items-center justify-center ml-base">
                            <span class="font-label-caps text-label-caps text-on-surface-variant">Bs</span>
                        </div>
                    </div>
                </div>
            </div>
            <!-- Rate Info Footer -->
            <div class="mt-md pt-md border-t border-surface-container-highest flex items-center gap-sm">
                <div class="w-10 h-10 rounded-lg bg-secondary-container flex items-center justify-center">
                    <span class="material-symbols-outlined text-on-secondary-container">trending_up</span>
                </div>
                <div>
                    <p class="font-label-caps text-label-caps text-on-surface-variant uppercase">Tasa del día seleccionado</p>
                    <p id="rateLabel" class="font-data-mono text-data-mono text-primary text-lg">0.00 VES</p>
                </div>
            </div>
        </div>

        <script src="app.js"></script>
    </div>
</body>
</html>
